[package]
name = "porch"
version = "0.2.0"
description = "Porch desktop and Android client"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "porch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
